name: Godot dedicated spawn smoke test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dedicated-spawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.6"
      GODOT_ARCHIVE: Godot_v4.6-stable_linux.x86_64.zip

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Godot 4.6
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot
          godot --version

      - name: Diagnosticar tabelas CSV antes da importação
        run: ./scripts/diagnose_data_csv_imports.sh

      - name: Importar projeto Godot
        run: ./scripts/import_godot_project.sh

      - name: Executar servidor e dois clientes headless
        run: ./scripts/smoke_test_dedicated_spawn.sh

      - name: Publicar logs do import e runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-dedicated-spawn-logs
          path: |
            artifacts/godot-import/csv-diagnostics.log
            artifacts/godot-import/import.log
            artifacts/godot-import/import.normalized.log
            artifacts/godot-smoke-test/*.log
          if-no-files-found: warn
